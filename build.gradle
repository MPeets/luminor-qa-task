plugins {
    id 'java'
    id 'io.qameta.allure' version '4.1.0'
}

group = 'com.qa'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly 'org.projectlombok:lombok:1.18.46'
    annotationProcessor 'org.projectlombok:lombok:1.18.46'
    testCompileOnly 'org.projectlombok:lombok:1.18.46'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.46'

    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.1'
    implementation 'io.rest-assured:rest-assured:6.0.1'

    testImplementation platform('org.junit:junit-bom:5.14.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testImplementation 'org.awaitility:awaitility:4.3.0'
    testImplementation 'com.codeborne:selenide:7.17.0'

    testImplementation platform('io.qameta.allure:allure-bom:2.35.3')
    testImplementation 'io.qameta.allure:allure-rest-assured'
    testImplementation 'io.qameta.allure:allure-selenide'
}

allure {
    version = '2.34.1'
    report {
        singleFile = true
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    outputs.upToDateWhen { false }
    def headless = System.getProperty('selenide.headless')
    if (headless != null) {
        systemProperty 'selenide.headless', headless
    }
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

tasks.register('apiTest', Test) {
    group = 'verification'
    description = 'Runs tests tagged api'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'api'
    }
}

tasks.register('uiTest', Test) {
    group = 'verification'
    description = 'Runs tests tagged ui'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'ui'
    }
}
